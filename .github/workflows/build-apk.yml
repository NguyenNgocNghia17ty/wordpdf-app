name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: bash tools/build.sh

      - name: Phat hanh APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WordPDF build ${{ github.run_number }}
          body: Tai file WordPDF.apk ben duoi ve dien thoai de cai.
          files: WordPDF.apk

      - name: Bao loi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -n 150 build.log 2>/dev/null || echo "khong co build.log"; echo '```'; } > tail.md
          gh issue create --title "Build ${{ github.run_number }} loi" --body-file tail.md
